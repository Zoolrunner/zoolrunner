<!doctype html><html><head><title>Storage cache clearing regression (HTTP)</title></head>
<body><iframe id="child" src="about:blank"></iframe><script>
var testDone=false,testFailures=0,testResults=[];
var testRequestStorageClear=false,testStorageClearDone=false;
var round=0,store,childStore;
function check(a,b,n){var ok=a===b;if(!ok)++testFailures;testResults.push((ok?'PASS ':'FAIL ')+n+(ok?'':': '+a+' expected '+b));}
function fail(e){check(String(e),'no exception','unexpected exception');testDone=true;}
function write(){
  ++round;
  store.setItem('round'+round,'value');
  store.setItem('','empty');
  // Populate both the native key cache and resolved named properties.
  check(store.length,2,'round '+round+' populated length');
  check(store['round'+round],'value','round '+round+' named property');
  check(Object.keys(childStore).length,2,'round '+round+' shared key cache');
  testStorageClearDone=false;testRequestStorageClear=true;
  setTimeout(afterClear,20);
}
function afterClear(){try{
  if(!testStorageClearDone){setTimeout(afterClear,20);return;}
  check(store.length,0,'round '+round+' cleared length');
  check(store.key(0),null,'round '+round+' cleared key cache');
  check(store.getItem('round'+round),null,'round '+round+' cleared value');
  check(store['round'+round],undefined,'round '+round+' cleared named property');
  check(Object.keys(childStore).length,0,'round '+round+' cleared shared enumeration');
  check(childStore.getItem(''),null,'round '+round+' cleared empty key');
  if(round<3)write();else testDone=true;
}catch(e){fail(e);}}
window.onload=function(){try{
  store=localStorage;store.clear();
  childStore=document.getElementById('child').contentWindow.localStorage;
  write();
}catch(e){fail(e);}};
</script></body></html>
