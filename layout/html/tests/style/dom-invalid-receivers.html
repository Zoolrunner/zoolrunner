<!doctype html><html><head><title>DOM native receiver validation</title></head><body><div id="target"></div><script>
var testDone=false,testFailures=0,testResults=[];
function check(a,b,n){var ok=a===b;if(!ok)++testFailures;testResults.push((ok?'PASS ':'FAIL ')+n);}
window.onload=function(){
 var target=document.getElementById('target');
 var methods=[['requestAnimationFrame',window.requestAnimationFrame,[function(){}]],
 ['cancelAnimationFrame',window.cancelAnimationFrame,[1]],
 ['getElementsByClassName',target.getElementsByClassName,['x']],
 ['getBoundingClientRect',target.getBoundingClientRect,[]],
 ['getClientRects',target.getClientRects,[]],
 ['insertAdjacentHTML',target.insertAdjacentHTML,['beforeend','x']]];
 for(var i=0;i<methods.length;++i){var caught;try{methods[i][1].apply({},methods[i][2]);}catch(e){caught=e;}
 check(caught instanceof TypeError,true,methods[i][0]+' rejects ordinary object receiver');}
 testDone=true;
};
</script></body></html>
